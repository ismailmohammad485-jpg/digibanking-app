name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Cordova Android APK
        run: |
          npm install -g cordova
          cordova create app_build com.standardbank.digibanking Digibanking
          cp -r www/* app_build/www/
          cp config.xml app_build/
          cd app_build
          cordova platform add android
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Digibanking-APK
          path: app_build/platforms/android/app/build/outputs/apk/debug/app-debug.apk
